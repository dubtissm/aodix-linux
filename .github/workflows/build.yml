# builds Aodix on every push and pull request
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    # the oldest supported distribution: packages built here also run on newer systems
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libx11-dev libxext-dev zlib1g-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build
